name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate external API configuration
        env:
          PRESCRIMED_API_URL: ${{ vars.PRESCRIMED_API_URL }}
        run: |
          if [ -z "$PRESCRIMED_API_URL" ]; then
            echo "PRESCRIMED_API_URL não está definida. GitHub Pages precisa de uma API HTTPS externa."
            exit 1
          fi
          case "$PRESCRIMED_API_URL" in
            https://*/api|https://*/api/)
              ;;
            *)
              echo "PRESCRIMED_API_URL deve ser uma URL HTTPS terminando em /api."
              exit 1
              ;;
          esac
      - run: npm run build:github
        env:
          VITE_API_URL: ${{ vars.PRESCRIMED_API_URL }}
          VITE_BACKEND_ROOT: ${{ vars.PRESCRIMED_BACKEND_ROOT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4